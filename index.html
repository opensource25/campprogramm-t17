<style>
:root{
  --bg:#f4f5f7; --surface:#ffffff; --ink:#14161a; --muted:#7a808b; --line:#dfe2e7;
  --accent:#2b55d9; --accent-soft:#e6ecff; --danger:#c43b3b;
  --serif: ui-serif,"New York","Iowan Old Style",Georgia,serif;
  --sans: -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme: light;
}
:root[data-theme="dark"]{
  --bg:#0f1114; --surface:#171a1f; --ink:#eceef2; --muted:#8a909b; --line:#272b32;
  --accent:#8fb0ff; --accent-soft:#1c2540; --danger:#ff7a7a;
  color-scheme: dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:17px;line-height:1.4;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
  transition:background .25s,color .25s;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,[contenteditable]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:640px;margin:0 auto;padding:0 20px 120px}

header{
  position:sticky;top:0;z-index:5;margin:0 -20px;padding:18px 20px 10px;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{margin:0;font-family:var(--serif);font-weight:500;font-size:26px;letter-spacing:-.01em}
.tools{display:flex;gap:6px}
.icon{
  width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--muted);
  transition:background .2s,color .2s;
}
.icon:hover{background:var(--surface);color:var(--ink)}
.icon[aria-pressed="true"]{background:var(--accent);color:var(--bg)}
.icon svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.days{display:flex;gap:6px;overflow-x:auto;margin:14px -20px 0;padding:2px 20px 6px;scrollbar-width:none;scroll-snap-type:x proximity}
.days::-webkit-scrollbar{display:none}
.day{
  flex:0 0 auto;min-width:52px;padding:7px 10px;border-radius:14px;text-align:center;scroll-snap-align:center;
  color:var(--muted);transition:background .2s,color .2s;
}
.day b{display:block;font-weight:600;font-size:12px;letter-spacing:.02em}
.day span{display:block;font-size:19px;font-variant-numeric:tabular-nums;font-weight:500;margin-top:1px}
.day[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.day.today:not([aria-selected="true"]){box-shadow:inset 0 0 0 1.5px var(--accent);color:var(--ink)}

.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:26px 0 8px}
.head h2{margin:0;font-family:var(--serif);font-weight:500;font-size:34px;letter-spacing:-.02em;line-height:1.1}
.head .sub{color:var(--muted);font-size:15px;margin-top:4px}
.nav{display:flex;gap:4px;flex:0 0 auto}
.nav .icon{background:var(--surface)}
.nav .icon:disabled{opacity:.35;cursor:default}

ol{list-style:none;margin:18px 0 0;padding:0}
li.row{
  display:grid;grid-template-columns:64px 1fr;gap:0 14px;padding:13px 0;border-top:1px solid var(--line);position:relative;
}
li.row:last-child{border-bottom:1px solid var(--line)}
.t{font-variant-numeric:tabular-nums;color:var(--muted);font-size:16px;padding-top:1px;white-space:nowrap}
.t input[type="time"]{
  width:100%;border:0;background:transparent;color:inherit;font:inherit;padding:0;margin:0;min-height:1.4em;
}
.t input[type="time"]::-webkit-calendar-picker-indicator{opacity:.7;cursor:pointer}
.x{font-weight:500;overflow-wrap:anywhere}
.n{display:block;color:var(--muted);font-size:14.5px;font-weight:400;margin-top:1px}
.n:empty{display:none}
li.row.now{background:linear-gradient(90deg,var(--accent-soft),transparent);margin:0 -12px;padding-left:12px;padding-right:12px;border-radius:12px;border-color:transparent}
li.row.now .t{color:var(--accent);font-weight:600}
li.row.now + li.row{border-top-color:transparent}

/* Bearbeiten */
.editing [contenteditable]{
  background:var(--surface);border-radius:8px;padding:2px 6px;margin:-2px -6px;min-height:1.4em;display:block;
  box-shadow:inset 0 0 0 1px var(--line);-webkit-user-select:text;user-select:text;
}
.editing .t[contenteditable]{display:block}
.editing .n:empty{display:block}
.editing .n:empty::before{content:"Notiz";color:var(--muted);opacity:.55}
.editing .x:empty::before{content:"Termin";color:var(--muted);opacity:.55}
.editing .t:empty::before{content:"Zeit";opacity:.55}
.del{display:none;position:absolute;right:0;top:10px;width:32px;height:32px;color:var(--danger)}
.editing .del{display:grid;place-items:center}
.editing .x{padding-right:30px}
.del svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.bar{display:none;gap:8px;flex-wrap:wrap;margin-top:18px}
.editing .bar{display:flex}
.btn{padding:10px 16px;border-radius:12px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font-size:15px}
.btn.primary{background:var(--accent);color:var(--bg);box-shadow:none;font-weight:600}
.btn.danger{color:var(--danger)}
.hint{display:none;color:var(--muted);font-size:13.5px;margin-top:12px}
.editing .hint{display:block}
.editing .head h2[contenteditable],.editing .sub [contenteditable]{display:inline-block;min-width:3ch}
.sub{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

#toast{
  position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;
  transition:opacity .25s,transform .25s;
}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (min-width:600px){.head h2{font-size:40px}}
</style>

</div>

 {iso:"2026-10-24",name:"Samstag",date:"24.10.2026",place:"Berlin",items:[

const KEY = "camp26t17:v1";
const THEME_KEY = "camp26t17:theme";
const SHORT = {Samstag:"Sa",Sonntag:"So",Montag:"Mo",Dienstag:"Di",Mittwoch:"Mi",Donnerstag:"Do",Freitag:"Fr"};

const clone = o => JSON.parse(JSON.stringify(o));
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};

let data;
try{ data = JSON.parse(store.get(KEY)); }catch(e){}
if(!Array.isArray(data) || !data.length) data = clone(DEFAULT_DATA);

let cur = 0, editing = false;
const $ = id => document.getElementById(id);
const app = $("app"), list = $("list"), daysEl = $("days");

function todayIso(){
  const d = new Date(), p = n => String(n).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
}
function save(){ store.set(KEY, JSON.stringify(data)); }

/* Tage */
function buildDays(){
  const t = todayIso();
  daysEl.innerHTML = "";
  data.forEach((d,i)=>{
    const b = document.createElement("button");
    b.className = "day" + (d.iso===t ? " today" : "");
    b.setAttribute("role","tab");
    b.dataset.i = i;
    const dayNum = (d.date||"").split(".")[0] || "";
    b.innerHTML = "<b>"+esc(SHORT[d.name]||(d.name||"").slice(0,2))+"</b><span>"+esc(dayNum)+"</span>";
    b.onclick = () => go(i);
    daysEl.appendChild(b);
  });
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* Zeilen */
function rowEl(item, i){
  const li = document.createElement("li");
  li.className = "row";
  li.innerHTML =
    (editing
      ? '<div class="t"><input type="time" data-k="0" aria-label="Uhrzeit"></div>'
      : '<div class="t" data-k="0"></div>') +
    '<div class="x"><span data-k="1" class="xt"></span><span class="n" data-k="2"></span></div>' +
    '<button class="del" aria-label="Termin löschen"><svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></svg></button>';
  const tEl = li.querySelector('[data-k="0"]');
  if(tEl.matches("input")){
    const mins = parseTime(item[0]);
    if(mins!==null){
      const h = String(Math.floor(mins/60)).padStart(2,"0");
      const m = String(mins%60).padStart(2,"0");
      tEl.value = h+":"+m;
    }
  } else {
    tEl.textContent = item[0];
  }
  li.querySelector('[data-k="1"]').textContent = item[1];
  li.querySelector('[data-k="2"]').textContent = item[2] ? "(" + item[2] + ")" : "";
  li.querySelector(".del").onclick = () => { data[cur].items.splice(i,1); save(); render(); };
  return li;
}

function render(){
  const d = data[cur];
  sortItemsByTime(d);
  document.querySelectorAll(".day").forEach((b,i)=>{
    const sel = i===cur;
    b.setAttribute("aria-selected", sel);
    if(sel) b.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"});
  });
  $("dayName").textContent = d.name;
  $("dayDate").textContent = d.date;
  $("dayPlace").textContent = d.place ? "· " + d.place : "";
  if(editing) $("dayPlace").textContent = d.place || "";
  $("prev").disabled = cur===0;
  $("next").disabled = cur===data.length-1;

  list.innerHTML = "";
  d.items.forEach((it,i)=> list.appendChild(rowEl(it,i)));
  if(!d.items.length){
    const e = document.createElement("li");
    e.className = "row"; e.style.gridTemplateColumns = "1fr";
    e.innerHTML = '<span class="n" style="display:block">Keine Termine. Über „Bearbeiten“ hinzufügen.</span>';
    list.appendChild(e);
  }
  applyEditable();
  markNow();
  document.title = "Campprogramm 26/T17";
}

function applyEditable(){
  document.querySelectorAll("[data-k],[data-f]").forEach(el=>{
    if(el.matches("input")) return;
    if(editing) el.setAttribute("contenteditable","plaintext-only");
    else el.removeAttribute("contenteditable");
  });
  // Fallback für Browser ohne plaintext-only
  if(editing){
    const t = document.createElement("div");
    t.setAttribute("contenteditable","plaintext-only");
    if(t.contentEditable !== "plaintext-only")
      document.querySelectorAll("[data-k],[data-f]").forEach(el=>el.setAttribute("contenteditable","true"));
  }
}

/* Aktueller Termin */
function parseTime(s){
  const m = /(\d{1,2}):(\d{2})/.exec(s); return m ? (+m[1])*60 + (+m[2]) : null;
}
function sortItemsByTime(day){
  day.items = day.items
    .map((item, idx)=>({item, idx, t: parseTime(item[0])}))
    .sort((a,b)=>{
      const at = a.t===null ? Number.POSITIVE_INFINITY : a.t;
      const bt = b.t===null ? Number.POSITIVE_INFINITY : b.t;
      return at - bt || a.idx - b.idx;
    })
    .map(e=>e.item);
}
function markNow(){
  list.querySelectorAll(".now").forEach(e=>e.classList.remove("now"));
  if(editing || data[cur].iso !== todayIso()) return;
  const d = new Date(), mins = d.getHours()*60 + d.getMinutes();
  let idx = -1;
  data[cur].items.forEach((it,i)=>{ const t = parseTime(it[0]); if(t!==null && t<=mins) idx = i; });
  if(idx>=0 && list.children[idx]) list.children[idx].classList.add("now");
}
setInterval(markNow, 60000);

/* Navigation */
function go(i){
  if(i<0 || i>=data.length || i===cur) return;
  cur = i; store.set("camp26t17:day", i); render();
  window.scrollTo({top:0,behavior:"smooth"});
}
$("prev").onclick = () => go(cur-1);
$("next").onclick = () => go(cur+1);
document.addEventListener("keydown", e=>{
  if(editing && e.target.isContentEditable) return;
  if(e.key==="ArrowLeft") go(cur-1);
  if(e.key==="ArrowRight") go(cur+1);
});

/* Wischen */
let sx=0, sy=0, st=0;
document.addEventListener("touchstart", e=>{
  if(editing) return;
  const t = e.touches[0]; sx=t.clientX; sy=t.clientY; st=Date.now();
},{passive:true});
document.addEventListener("touchend", e=>{
  if(editing || !st) return;
  const t = e.changedTouches[0], dx=t.clientX-sx, dy=t.clientY-sy;
  if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.6 && Date.now()-st<600 && !e.target.closest(".days")) go(cur + (dx<0?1:-1));
  st=0;
},{passive:true});

/* Bearbeiten */
function toggleEdit(on){
  editing = on;
  app.classList.toggle("editing", on);
  $("editBtn").setAttribute("aria-pressed", on);
  render();
  if(!on) buildDays(), render();
}
$("editBtn").onclick = () => toggleEdit(!editing);
$("done").onclick = () => toggleEdit(false);

document.addEventListener("input", e=>{
  const el = e.target.closest("[data-k],[data-f]");
  if(!el) return;
  const txt = el.matches("input") ? el.value : el.textContent;
  if(el.dataset.f){
    data[cur][el.dataset.f] = txt.trim();
  } else {
    const li = el.closest("li.row"), i = [...list.children].indexOf(li), k = +el.dataset.k;
    if(!data[cur].items[i]) return;
    data[cur].items[i][k] = k===2 ? txt.replace(/^\s*\(|\)\s*$/g,"").trim() : txt.trim();
    if(k===0){ sortItemsByTime(data[cur]); render(); }
  }
  save();
});
// Notizfeld: Klammern beim Bearbeiten entfernen, beim Verlassen wiederherstellen
document.addEventListener("focusin", e=>{
  const el = e.target;
  if(editing && el.classList && el.classList.contains("n")) el.textContent = el.textContent.replace(/^\s*\(|\)\s*$/g,"");
});
document.addEventListener("focusout", e=>{
  const el = e.target;
  if(el.classList && el.classList.contains("n")){
    const v = el.textContent.replace(/^\s*\(|\)\s*$/g,"").trim();
    el.textContent = v ? "("+v+")" : "";
  }
  if(el.dataset && el.dataset.f==="place" ){ $("dayPlace").textContent = data[cur].place || ""; }
});
// Enter beendet Eingabe statt Zeilenumbruch
document.addEventListener("keydown", e=>{
  if(editing && e.key==="Enter" && e.target.isContentEditable){ e.preventDefault(); e.target.blur(); }
});

$("add").onclick = () => {
  data[cur].items.push(["","",""]); save(); render();
  const last = list.lastElementChild; if(last){ const f = last.querySelector('[data-k="0"]'); f.focus(); last.scrollIntoView({block:"center",behavior:"smooth"}); }
};
$("reset").onclick = () => {
  if(!confirm("Alle Änderungen verwerfen und Originalprogramm wiederherstellen?")) return;
  data = clone(DEFAULT_DATA); store.del(KEY); toast("Zurückgesetzt"); buildDays(); render();
};

/* Theme */
const ICONS = {
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/>',
  moon:'<path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/>'
};
function applyTheme(t){
  document.documentElement.dataset.theme = t;
  $("themeIcon").innerHTML = t==="dark" ? ICONS.sun : ICONS.moon;
  $("theme-color").setAttribute("content", t==="dark" ? "#0f1114" : "#f4f5f7");
}
let theme = store.get(THEME_KEY) || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
applyTheme(theme);
$("themeBtn").onclick = () => { theme = theme==="dark" ? "light" : "dark"; store.set(THEME_KEY, theme); applyTheme(theme); };

function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1800); }

/* Start: heutigen Tag, sonst zuletzt geöffneten */
buildDays();
const ti = data.findIndex(d=>d.iso===todayIso());
const last = parseInt(store.get("camp26t17:day"),10);
cur = ti>=0 ? ti : (last>=0 && last<data.length ? last : 0);
render();
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) markNow(); });
</script>
</body>
</html>
